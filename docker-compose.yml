services:
  jenkins:
    build: .
    image: program-5-jenkins:latest
    container_name: jenkins-ci
    restart: unless-stopped
    group_add:
      - "973"
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
